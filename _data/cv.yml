    Research Experience:
      - company: Mobility Systems Laboratory, UT Austin
        position: Graduate Research Assistant
        start_date: 2025-01
        end_date: present
        highlights:
          - Developed hybrid physics-informed machine learning architectures for driver behavior prediction at four-way intersections.
          - Designed interaction-aware and driver-mode-aware Intelligent Driver Models augmented with learned latent representations.
          - Trained and evaluated models using 163 NGSIM intersection scenarios and human-driver simulator datasets.
          - Achieved 0.623 m/s velocity RMSE over a 2-second prediction horizon.
          - Reduced unseen-scenario acceleration prediction RMSE from 20.5 m/s² to 4.06 m/s² compared to EBM baselines.
          - Developed MATLAB and Python pipelines for scenario extraction, feature engineering, training, and rollout analysis.

      - company: Mobility Systems Laboratory, UT Austin
        position: Researcher – Explainable Driver Modeling
        start_date: 2024-01
        end_date: present
        highlights:
          - Developed interpretable driver models using SHAP-based feature selection and Explainable Boosting Machines.
          - Engineered physically meaningful driver-behavior features from vehicle kinematics and traffic interactions.
          - Proposed residual-learning adaptation methods for personalized driver modeling from sparse datasets.
          - Achieved 94.4% fidelity for synthetic drivers and up to 88.5% fidelity for human-driver behavior.
          - Preserved individual driving styles and achieved 75% driver identification accuracy on unseen data.

    Engineering Experience:
      - company: EcoCAR Connected and Autonomous Vehicle Team
        position: Team Leader
        start_date: 2025-01
        end_date: 2026-05
        highlights:
          - Led a multidisciplinary team of 8 undergraduate and graduate students developing CAV technologies on a Cadillac LYRIQ.
          - Directed development of CACC, LKA, Automated Intersection Navigation, sensor fusion, and V2X-enabled autonomy features.
          - Coordinated model-based development workflows using MATLAB/Simulink, RTMaps, dSPACE ASM, and dSPACE AUTERA.

      - company: EcoCAR
        position: Lead Developer – Cooperative Adaptive Cruise Control (CACC)
        start_date: 2025-01
        end_date: 2025-05
        highlights:
          - Co-developed an MPC-based CACC system utilizing SAE J2735 V2V communication.
          - Integrated V2X vehicle state information into real-time control algorithms.
          - Implemented CAN-FD communication between dSPACE AUTERA and vehicle control systems.
          - Successfully deployed and validated the controller on a Cadillac LYRIQ.
          - Achieved 0.062 m steady-state spacing RMSE, 2.999 m/s³ maximum jerk, and 1.707 m/s² maximum acceleration.

      - company: EcoCAR
        position: Lead Developer – Lane Keeping Assist (LKA)
        start_date: 2025-01
        end_date: 2025-05
        highlights:
          - Guided development of a Sliding Mode Controller using LiDAR and camera perception inputs.
          - Mentored undergraduate team members in controller design and validation.
          - Validated controller performance through HIL and vehicle testing.
          - Achieved 0.121 m lateral tracking error and 0.35 m/s³ lateral jerk in HIL testing.
          - Conducted vehicle-in-the-loop testing and identified sensor latency limitations.

    Selected Projects:
      - company: The University of Texas at Austin
        position: Project Lead – Autonomous Vehicle Path Tracking
        start_date: 2024-01
        end_date: 2024-12
        highlights:
          - Designed and tested a path-tracking controller capable of lane changes at 40 m/s with 0.1 m lateral error.
          - Used root-locus and frequency-domain design methods to satisfy system requirements.
          - Reduced lateral tracking RMSE by 52.98% for single lane changes and 48.61% for double lane changes.
          - Achieved performance comparable to MPC with significantly lower computational cost.

      - company: Yonsei University
        position: Team Member – Advanced Mechatronics Competition (1st Place)
        start_date: 2023-08
        end_date: 2023-12
        highlights:
          - Designed and manufactured an autonomous mobile robot capable of target localization and pneumatic actuation.
          - Created 12 custom SolidWorks components under strict dimensional constraints.
          - Tested five prototypes and achieved reliable 1.5 m projectile launch capability.

